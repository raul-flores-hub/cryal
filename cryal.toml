# =============================================================================
# CrYAL — Crystal Structure Prediction via Active Learning
# cryal.toml — Main configuration file
#
# Format: TOML (https://toml.io). [tables] group the settings; strings are
# quoted, true/false are booleans, lists go in [ ]. Every key is checked when
# the file is read: a misspelt key or a value of the wrong type stops the run
# with the path of the entry, rather than leaving a default in its place.
# Any key left out takes its default. An input in the format CrYAL used
# before (% SECTION headers) converts with: cryal convert OLD_FILE cryal.toml
#
# IMPORTANT — blind search design:
#   This tool is designed to find crystal structures WITHOUT prior knowledge
#   of the experimental structure. Do NOT set monoclinic_beta.mode, preferred
#   space groups, or volume ranges based on experimental data. The GP will
#   discover favorable regions autonomously through the active learning cycles.
# =============================================================================

[general]
molecule    = "examples/benzene.xyz"  # XYZ file of one molecule (this is only the shipped example)
Z           = 4                       # molecules per unit cell (benzene crystallizes Pbca, Z = 4)
random_seed = 33936
output_dir  = "AL_results"            # all output goes here
log_level   = "INFO"                  # "INFO" or "DEBUG"
resume      = false                   # true (or pass --resume) = continue an interrupted run in output_dir
algorithm   = "bach"                  # the search:
                                      #   "bach"    GP + Expected Improvement (the published method)
                                      #   "ga"      genetic algorithm, see [ga]
                                      #   "random"  pure random search: the baseline, no learning
                                      #   "basin_hopping"  Metropolis walks between minima, see [basin_hopping]
                                      #   "pso"     particle swarm (CALYPSO-like), see [pso]

[backend]
# Which engine relaxes each candidate and returns its energy.
#   "lammps_mace"  external LAMMPS process driving MACE-OFF23 (the published run)
#   "ase"          in-process relaxation with any ASE calculator; see [backend.ase]
#   "uma"          in-process relaxation with UMA (fairchem); see [backend.uma]
# Omitting the key means "lammps_mace".
engine            = "lammps_mace"
energy_sanity_max = -100.0            # eV per cell; energies above this = failed relaxation (false disables)

[backend.lammps]
input   = "in_v3.lammps"              # LAMMPS input script for relaxation
command = "lmp -k on g 1 -sf kk -pk kokkos newton on neigh half"   # Kokkos GPU build required by MACE-OFF mliap (forward_exchange)
species = ["C", "H"]                  # element order for LAMMPS atom types; must match pair_coeff in the LAMMPS script

# [backend.ase]
# Only read when engine = "ase". The calculator is named by dotted path,
# so no calculator is a dependency of CrYAL; it is built once and reused.
# NOTE: this is a local relaxation, not the MD-NPT protocol of the LAMMPS
# script, and energies from different backends are not comparable.
# calculator        = "mace.calculators.mace_off"
# calculator_kwargs = { model = "medium", device = "cuda" }

# [backend.uma]
# Only read when engine = "uma". UMA needs no dotted path and no factory
# module of your own: it ships as a backend because it cannot be named by a
# dotted path (its one-call constructor is a classmethod) and because a
# hand-written factory would not exist on the other machines of a parallel run.
#
# Install: `pip install fairchem-core` into the interpreter that runs CrYAL,
# plus a Hugging Face token for the gated checkpoint. This is NOT the ORCA
# external-tools installation — CrYAL drives UMA in-process through ASE and
# needs neither the Flask server nor the ORCA client. See INSTALL.md §5.
#
# task is MANDATORY and has no default. Each head was trained on a different
# domain and each has its own zero of energy: for one periodic C50Au4 cell
# "omat" gives -466.55 eV and "oc20" -447.06 eV. Numbers from two heads are not
# comparable and nothing downstream would show the mix.
#   "omc"    organic molecular crystals   <- this is the one for CSP
#   "omat"   inorganic / periodic materials
#   "oc20"   adsorbates on catalyst surfaces
#   "omol"   isolated molecules (not periodic)
#   "odac"   MOFs for direct air capture
# model              = "uma-s-1p1"    # checkpoint; older fairchem does not list 1p2
# task               = "omc"          # MANDATORY, no default
# device             = "cuda"         # "cuda" or "cpu"
# inference_settings = "default"      # "default" or a preset name; do NOT build
#                                     # an InferenceSettings object by hand

# [relaxation]
# The in-process relaxation, shared by the "ase" and "uma" engines; the
# "lammps_mace" engine relaxes with its LAMMPS script instead. max_steps does
# not carry between calculators: the end of each cycle reports how much of
# that budget the relaxations actually needed.
# optimizer  = "FIRE"                 # FIRE, BFGS, LBFGS, BFGSLineSearch, GPMin
# fmax       = 0.05                   # eV/A
# max_steps  = 500                    # not converged by here = discarded, and reported
# relax_cell = true                   # relax cell and positions (FrechetCellFilter)

[active_learning]
cycles                = 10            # number of AL cycles after initialization
initial_structures    = 100           # structures generated in cycle 0
structures_per_cycle  = 50            # structures generated per AL cycle
pool_size             = 20            # best structures kept as seeds between cycles
max_no_improve_cycles = 3             # stop if best energy unchanged for N cycles
ga_fraction           = 0.0           # BACH + GA: share of each cycle's random half bred
                                      # from the best structures so far by the [ga]
                                      # operators (crossover, strain, rotation,
                                      # translation; immigrants get no share, the
                                      # random structures left are the immigrants).
                                      # 0 = BACH as published. Cycle 0 is unaffected.

[space_groups]
# group = weight. Weights based on CSD frequency statistics for organic
# molecular crystals. No bias toward any specific SG — the GP will discover
# which is favorable.
#   SG 14 (P2_1/c):   ~36%   monoclinic
#   SG  2 (P-1):      ~24%   triclinic
#   SG 19 (P2_12_12_1): ~11% orthorhombic
#   SG 15 (C2/c):      ~7%   monoclinic
#   SG  4 (P2_1):      ~6%   monoclinic
#   SG  9 (Cc):        ~4%   monoclinic
#   SG 33 (Pna2_1):    ~2%   orthorhombic
#   SG 61 (Pbca):      ~2%   orthorhombic
# Any group 1-230 may be listed; the cell is drawn for its crystal system
# (trigonal and rhombohedral groups in the hexagonal setting). Above 74 a
# group usually needs Z to match its Wyckoff multiplicities: with Z = 4,
# I4_1/a (88, general position 16) only fits a molecule that sits on a
# special position with the right site symmetry. A group that never yields
# a structure is named in the log with PyXtal's reason.
weights = { 14 = 36, 2 = 24, 19 = 11, 15 = 7, 4 = 6, 9 = 4, 33 = 2, 61 = 2 }

[volume]
# Volume range in Å³ for initial structure generation. Without min and max it
# is estimated from the molecular weight and the density range below. This
# is the only prior knowledge needed: a plausible density range for organic
# molecular crystals (typically 0.8–1.6 g/cm³).
# min = 400.0
# max = 900.0
density = [0.8, 1.6]                  # g/cm³ — [low, high] for the estimate
# If PyXtal cannot place molecules at the target volume, the cell is expanded
# in these steps until placement succeeds.
expansion_factors = [1.0, 1.05, 1.10, 1.15, 1.20, 1.35, 1.50]

[cell]
min_axis = 5.0                        # Å — reject cells with any axis < this
                                      # Scale this with your molecule: 5 Å suits benzene
                                      # (real cell 7.4 x 9.4 x 6.8 Å); a large planar
                                      # molecule needs a much larger value.

[monoclinic_beta]
# Beta angle distribution for monoclinic space groups — UNIFORM (blind).
# The GP + EI will discover the favorable beta range through sampling.
# Do NOT set distribution = "triangular" unless you have prior knowledge.
range        = [90.0, 150.0]          # degrees
distribution = "uniform"              # "uniform" (blind) or "triangular" (informed)
# mode       = 101.0                  # only used if distribution = "triangular"

[gp]
# enabled = false runs the same workflow with the surrogate off: candidates
# are generated at random instead of half-biased by Expected Improvement
# (the ablation control for the Bayesian guidance).
enabled        = true
anisotropy     = false                # add longest/shortest axis as a GP feature
kernel         = "matern25"           # "matern25" (recommended) or "rbf"
n_restarts     = 5                    # optimizer restarts for kernel hyperparameters
ei_xi          = 0.01                 # exploration parameter (higher = more exploration)
ei_candidates  = 50000                # random candidates evaluated for EI maximization
ei_suggestions = 20                   # top EI candidates used to bias next generation
# Variants of the Bayesian optimization. Left out, these are the published
# method: Expected Improvement, the best candidates kept 0.5 apart.
# acquisition = "ei"                  # "ei", "ucb" (mu - kappa sigma) or "thompson"
#                                     # (each suggestion the minimum of one posterior draw)
# ucb_kappa   = 2.0                   # "ucb": 0 = lowest predicted energy, larger = explore
# batch       = "diverse"             # "diverse" or "believer": kriging believer, each pick
#                                     # believed at its prediction before the next (ei, ucb)
# pool        = 2000                  # candidates "thompson" and "believer" work on

[ga]
# Read when general.algorithm = "ga", and by the BACH + GA hybrid
# (active_learning.ga_fraction > 0), which uses population_size, the
# tournament, the operator settings and the duplicate tolerances. The budget is [active_learning]'s:
# cycles = generations, initial_structures = generation 0 (generated exactly as
# BACH's cycle 0), structures_per_cycle = children per generation,
# max_no_improve_cycles = the stopping rule. A GA run and a BACH run from one
# file therefore spend the same evaluations.
#
# The population is the population_size lowest-energy distinct structures in
# the database, by the rule of [duplicates]. Children are P1 crystals of
# rigid molecules, relaxed by the backend like any other candidate.
population_size   = 20
tournament_size   = 3                 # parents: best of this many drawn at random
# Share of each generation per operator (weights; an operator left out is 0):
#   crossover    cut-and-splice of two parents along a random plane
#   strain       random symmetric deformation of the cell, at constant volume
#   rotation     some molecules turn about their centres
#   translation  some molecules move
#   immigrant    a fresh random structure from the generator (diversity)
operators         = { crossover = 0.5, strain = 0.1, rotation = 0.1, translation = 0.1, immigrant = 0.2 }
strain_sigma      = 0.10              # std of each strain-tensor component
max_rotation      = 45.0              # degrees
max_translation   = 1.0               # Å
fraction_mutated  = 0.5               # of the molecules, for rotation and translation

[duplicates]
# When two relaxed structures are the same minimum, wherever a search needs
# distinct ones (the GA's and BACH + GA's population, basin hopping's start):
# energies per molecule within `energy` AND packings within `fingerprint`, the
# Oganov-Valle cosine distance over intermolecular distances (0 = identical,
# 1 at most; cryal/fingerprint.py). On benzene, the same crystal rattled by
# 0.01 Å and strained 0.2 % -- one minimum reached twice -- gave D <= 0.007;
# crystals that differ only in how the molecules are turned, D >= 0.032.
# Calibrate it on your own run with tools/distinct_minima.py --calibrate.
# fingerprint = 0 compares densities instead (within `density`).
energy      = 0.002                   # eV per molecule
fingerprint = 0.02
density     = 0.005                   # g/cm³, only when fingerprint = 0

[basin_hopping]
# Only read when general.algorithm = "basin_hopping"; the budget is
# [active_learning]'s, cycle 0 is BACH's. `walkers` chains start from cycle 0's
# lowest distinct structures; each cycle every walker makes its share of
# structures_per_cycle trial moves from its current minimum and moves to its
# best trial if dE <= 0, or else with probability exp(-dE / kT), dE per molecule.
walkers          = 10
temperature      = 0.01               # kT, eV per molecule (0.01 ≈ 1 kJ/mol); 0 = downhill only
moves            = { strain = 1, rotation = 1, translation = 1 }   # weights, as the GA's mutations
strain_sigma     = 0.10               # std of each strain-tensor component
max_rotation     = 45.0               # degrees
max_translation  = 1.0                # Å
fraction_mutated = 0.5                # of the molecules, for rotation and translation

[pso]
# Only read when general.algorithm = "pso"; the budget is [active_learning]'s,
# cycle 0 is BACH's. Each cycle, random_fraction of structures_per_cycle is
# fresh random structures and the rest are the particles, one step each:
#   v <- w v + c1 r1 (own best - x) + c2 r2 (swarm best - x),  x <- relaxed(x + v)
# v = cell strain, centre shifts, molecular turns (molecule symmetry accounted).
# The particles start from cycle 0's lowest distinct structures ([duplicates]).
random_fraction = 0.4                 # CALYPSO's share of new random structures
inertia         = [0.9, 0.4]          # w, falling linearly from the first cycle to the last
c1              = 2.0                 # pull toward the particle's own best
c2              = 2.0                 # pull toward the swarm's best
max_strain      = 0.10                # per step, Frobenius norm of the cell strain
max_shift       = 1.0                 # Å per step, per molecular centre
max_turn        = 30.0                # degrees per step, per molecule

[chpi]
# CH-pi geometric optimizer: adjusts molecular positions to maximize
# H...aromatic centroid contacts in the d_range range.
# Set enabled = false to skip this step entirely.
enabled               = true
d_range               = [2.6, 3.5]    # Å — equilibrium range [low, high]
d_target              = 3.0           # Å — target H...centroid distance
d_search              = 6.0           # Å — search radius for contacts
angle_ch_centroid_min = 110.0         # degrees — min C-H...centroid angle
angle_from_normal_max = 55.0          # degrees — max angle from ring normal
max_iter              = 100           # max optimizer iterations per structure
max_no_improve        = 10            # stop if no improvement for N iterations

[contacts]
# Minimum intermolecular contact distances for structure filtering
min_hh    = 1.8                       # Å — H...H
min_heavy = 2.5                       # Å — heavy...heavy
min_hx    = 1.8                       # Å — H...heavy

[seeds]
# If enabled, CIF files in folder/ are loaded and used to generate
# perturbations as additional starting structures. If the folder is empty
# or does not exist, the run starts from PyXtal only.
enabled                = true
folder                 = "Seeds"
perturbations_per_seed = 30
max_rotation           = 30.0         # degrees
max_translation        = 0.1          # Å
fraction_perturbed     = 0.5          # fraction of molecules perturbed per structure

[integrity]
# Molecular integrity check after relaxation.
# Rejects structures where MACE-OFF23 (reactive potential) broke covalent bonds.
enabled        = true
max_bond_ratio = 2.0                  # bond broken if length > ratio * sum(cov_radii)

[parallel]
# Candidates within a cycle are independent, so they can be relaxed on several
# machines at once. This distributes whole candidates; it does not split one
# relaxation, and it does not change what any of them returns.
#
# Requirements on every worker: passwordless ssh from this machine, CrYAL and
# its dependencies installed, and the energy engine (lmp) available to a
# non-interactive ssh session.
#
# workers  one entry per machine — "user@host:slots"
#          slots = how many candidates that machine relaxes at once.
#          Add a third field when the interpreter that can import cryal is
#          not the `python3` on its PATH, which on a machine set up for MACE
#          it usually is not:
#              workers = ["raul@192.168.1.11:4:/home/raul/mace-env/bin/python"]
#          Machines pull candidates from a shared queue, so a slow one simply
#          takes fewer; nothing waits on the slowest.
enabled          = false
workers          = []
local_slots      = 1                  # slots on the server itself; 0 = dispatch
                                      # everything, and then the server need not
                                      # run the backend at all
remote_dir       = "~/.cryal_work"    # per-run work dir on each worker
python           = "python3"          # default interpreter for the workers
ssh_key          = ""                 # private key, if not the default one
ssh_timeout      = 30                 # s — give up on connecting
task_timeout     = 0                  # s — 0 derives it from the backend
max_failures     = 3                  # drop a machine after N failures in a row
keep_remote      = false              # leave the remote work dir for debugging
fetch_on_failure = true               # copy a failed candidate's files back
fetch_step       = false              # copy every candidate's files back
